<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Lab 2 Bogovskiy</title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="src/index.js" type="module"></script>
</head>

<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
        <h2 class="text-center mb-4">MiniMaple</h2>

        <div class="mb-3">
            <label for="expressionInput" class="form-label">Выражение и переменная</label>
            <input type="text" class="form-control" id="expressionInput" placeholder="например: 4*x^3 - x^2, x">
        </div>

        <div class="mb-3">
            <label for="resultOutput" class="form-label">Результат</label>
            <input type="text" class="form-control font-monospace" id="resultOutput" readonly>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <button id="calcButton" class="btn btn-primary w-100">Вычислить</button>
    </div>

</div>
</body>
</html>
